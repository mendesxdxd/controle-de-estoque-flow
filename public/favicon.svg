<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>FlowStock</title>

  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1a1a2e"/>

  <!-- Chart bars -->
  <rect x="4"  y="19" width="4" height="9"  rx="1" fill="#7F77DD" opacity="0.5"/>
  <rect x="9"  y="15" width="4" height="13" rx="1" fill="#7F77DD" opacity="0.75"/>
  <rect x="14" y="10" width="4" height="18" rx="1" fill="url(#fg)"/>
  <rect x="19" y="15" width="4" height="13" rx="1" fill="#7F77DD" opacity="0.75"/>
  <rect x="24" y="19" width="4" height="9"  rx="1" fill="#7F77DD" opacity="0.5"/>

  <!-- Flow line -->
  <polyline
    points="6,18 11,13 16,9 21,13 26,18"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="16" cy="9" r="2" fill="#FFFFFF"/>
</svg>
