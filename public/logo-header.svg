<svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg">
  <title>FlowStock</title>

  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
  </defs>

  <!-- Icon background square -->
  <rect x="0" y="0" width="36" height="36" rx="8" fill="#1a1a2e"/>

  <!-- Mini chart bars -->
  <rect x="6"  y="22" width="4" height="9"  rx="1" fill="#7F77DD" opacity="0.5"/>
  <rect x="11" y="18" width="4" height="13" rx="1" fill="#7F77DD" opacity="0.7"/>
  <rect x="16" y="13" width="4" height="18" rx="1" fill="url(#iconGrad)"/>
  <rect x="21" y="18" width="4" height="13" rx="1" fill="#7F77DD" opacity="0.7"/>
  <rect x="26" y="22" width="4" height="9"  rx="1" fill="#7F77DD" opacity="0.5"/>

  <!-- Flow line -->
  <polyline
    points="8,21 13,16 18,12 23,16 28,21"
    fill="none"
    stroke="#EEEDFE"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="18" cy="12" r="2" fill="#EEEDFE"/>

  <!-- Wordmark -->
  <text
    x="46"
    y="20"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="17"
    font-weight="800"
    fill="#FFFFFF"
    letter-spacing="0.5"
  >Flow</text>
  <text
    x="47"
    y="32"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="10"
    font-weight="600"
    fill="#8B83FF"
    letter-spacing="2"
  >STOCK</text>
</svg>
