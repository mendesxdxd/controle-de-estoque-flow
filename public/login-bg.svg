<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <title>FlowStock Background Glass</title>

  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7FE8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4B3FC7" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F77DD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4B3FC7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="185" rx="160" ry="160" fill="url(#glowGrad)" filter="url(#glowBlur)" opacity="0.8"/>

  <rect x="175" y="60" width="250" height="250" rx="56"
    fill="url(#iconBg)"
    stroke="#FFFFFF"
    stroke-width="1"
    stroke-opacity="0.15"
  />

  <rect x="175" y="60" width="250" height="60" rx="56"
    fill="#FFFFFF"
    fill-opacity="0.06"
  />

  <rect x="210" y="230" width="28" height="60"  rx="5" fill="#FFFFFF" opacity="0.10"/>
  <rect x="246" y="200" width="28" height="90"  rx="5" fill="#FFFFFF" opacity="0.15"/>
  <rect x="282" y="162" width="28" height="128" rx="5" fill="url(#barGrad)"/>
  <rect x="318" y="200" width="28" height="90"  rx="5" fill="#FFFFFF" opacity="0.15"/>
  <rect x="354" y="230" width="28" height="60"  rx="5" fill="#FFFFFF" opacity="0.10"/>

  <polyline
    points="224,222 260,190 296,155 332,190 368,222"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
  />

  <circle cx="296" cy="155" r="7" fill="#FFFFFF" opacity="0.3"/>

  <polyline
    points="224,222 260,190 296,155 332,190 368,222"
    fill="none"
    stroke="#AFA9EC"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.18"
    filter="url(#softBlur)"
  />

  <text
    x="300"
    y="415"
    text-anchor="middle"
    font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif"
    font-size="72"
    font-weight="700"
    fill="#FFFFFF"
    fill-opacity="0.08"
    letter-spacing="1"
  >FlowStock</text>

  <text
    x="300"
    y="468"
    text-anchor="middle"
    font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif"
    font-size="18"
    font-weight="400"
    fill="#AFA9EC"
    fill-opacity="0.12"
    letter-spacing="4"
  >GESTÃO INTELIGENTE DE ESTOQUE</text>
</svg>
