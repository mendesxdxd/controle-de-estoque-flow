<svg width="600" height="360" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
  <title>FlowStock Logo</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEEDFE"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="20" fill="url(#bgGrad)"/>

  <!-- Chart bars (stock flow concept) -->
  <rect x="130" y="200" width="28" height="80" rx="5" fill="url(#purpleGrad)" opacity="0.5"/>
  <rect x="166" y="170" width="28" height="110" rx="5" fill="url(#purpleGrad)" opacity="0.65"/>
  <rect x="202" y="138" width="28" height="142" rx="5" fill="url(#purpleGrad)" opacity="0.8"/>
  <rect x="238" y="108" width="28" height="172" rx="5" fill="url(#peakGrad)"/>
  <rect x="274" y="138" width="28" height="142" rx="5" fill="url(#purpleGrad)" opacity="0.8"/>
  <rect x="310" y="170" width="28" height="110" rx="5" fill="url(#purpleGrad)" opacity="0.65"/>
  <rect x="346" y="200" width="28" height="80" rx="5" fill="url(#purpleGrad)" opacity="0.5"/>

  <!-- Flow curve over bars -->
  <polyline
    points="144,193 180,163 216,133 252,104 288,133 324,165 360,195"
    fill="none"
    stroke="#EEEDFE"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Peak dot -->
  <circle cx="252" cy="104" r="5" fill="#EEEDFE"/>

  <!-- Arrow indicator (up-right) -->
  <polyline
    points="340,110 365,110 365,135"
    fill="none"
    stroke="#7F77DD"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polygon points="365,110 373,118 357,118" fill="#7F77DD"/>

  <!-- Right side: wordmark -->
  <text
    x="430"
    y="175"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="2"
  >flow</text>

  <text
    x="430"
    y="228"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#7F77DD"
    letter-spacing="2"
  >stock</text>

  <!-- Divider line -->
  <line x1="390" y1="240" x2="476" y2="240" stroke="#534AB7" stroke-width="1.5"/>

  <!-- Tagline -->
  <text
    x="430"
    y="262"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="11"
    letter-spacing="3"
    fill="#AFA9EC"
  >INTELLIGENT FLOW</text>
</svg>
